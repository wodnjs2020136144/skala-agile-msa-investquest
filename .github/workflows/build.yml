# PR 이 깨진 코드를 main 에 올리지 못하게 막는 최소 방어선.
#
# GitHub Free + Private 리포는 브랜치 보호를 쓸 수 없어 "머지 차단"을 강제하지 못한다.
# 그래도 PR 화면에 빨간 X 가 뜨면 리뷰어가 본다. 팀 DoD 의 보조 장치다.
#
# Actions 는 private 리포도 월 2,000분 무료다.

name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 PR 에 연속 push 하면 이전 실행을 취소해 분(minute)을 아낀다
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Spring Boot 서비스 5개 ─────────────────────────────
  gradle:
    runs-on: ubuntu-latest

    # application.yml 의 datasource.url 이 컨테이너명(lecturedb)으로 하드코딩돼 있어
    # Spring Initializr 가 만들어 둔 contextLoads() 테스트가 DB 에 붙으려다 실패한다.
    # (UnknownHostException — CLAUDE.md §4-8 에 기록된 함정)
    # compose 가 하는 것과 같은 방식으로, 실제 DB 를 띄우고 환경변수로 덮는다.
    services:
      mariadb:
        image: mariadb:11.2
        env:
          MARIADB_ROOT_PASSWORD: SqlDba-1
          MARIADB_DATABASE: lecture_db
          MARIADB_USER: manager
          MARIADB_PASSWORD: SqlDba-1
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    strategy:
      fail-fast: false          # 한 서비스가 깨져도 나머지 결과를 본다
      matrix:
        service:
          - eureka-server
          - user-service
          - course-service
          - enrollment-service
          - payment-service
    steps:
      - uses: actions/checkout@v4

      # build.gradle 의 toolchain 이 21 이다
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
          cache-dependency-path: ${{ matrix.service }}/*.gradle*

      - name: build ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        env:
          # 컨테이너명 대신 러너의 localhost 로. 스키마는 ddl-auto: update 가 만든다.
          SPRING_DATASOURCE_URL: jdbc:mariadb://127.0.0.1:3306/lecture_db
          SPRING_DATASOURCE_USERNAME: manager
          SPRING_DATASOURCE_PASSWORD: SqlDba-1
          # 테스트 중 Eureka 에 등록하려 들지 않게 한다
          EUREKA_CLIENT_REGISTER_WITH_EUREKA: 'false'
          EUREKA_CLIENT_FETCH_REGISTRY: 'false'
          # bootstrap-servers 도 컨테이너명(kafka:9092)이라 해석되지 않는다.
          # enrollment-service 의 @KafkaListener 가 기동 단계에서 브로커를 찾다가
          # ConfigException 으로 컨텍스트를 죽인다.
          # 브로커까지 띄우는 대신 리스너 자동 시작만 끈다 — contextLoads 는
          # 빈이 만들어지는지를 보는 테스트이지 Kafka 연동 테스트가 아니다.
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          SPRING_KAFKA_LISTENER_AUTO_STARTUP: 'false'
        run: ./gradlew build --no-daemon

  # ── FastAPI ────────────────────────────────────────────
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'    # Dockerfile 이 python:3.12-slim
      - name: install
        working-directory: recommend-service
        run: pip install -r requirements.txt
      - name: syntax check
        working-directory: recommend-service
        # 테스트가 아직 없다. 최소한 문법이 깨지지 않았는지 본다.
        # import 로 확인하지 않는 이유: 진입점 main.py 가 기동 시 Eureka·Kafka 에
        # 붙으려 해서 러너에서는 임포트만으로도 실패한다.
        run: python -m compileall -q main.py app

  # ── Vue ────────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vue-frontend/package-lock.json
      - name: install
        working-directory: vue-frontend
        run: npm ci
      - name: build
        working-directory: vue-frontend
        run: npm run build

  # ── compose 파일이 유효한지 ────────────────────────────
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate docker-compose.yml
        # 실제 기동은 하지 않는다. 인프라 이미지 2종이 arm64 전용이라
        # ubuntu-latest(x86_64) 러너에서는 돌지 않는다.
        run: docker compose config --quiet
