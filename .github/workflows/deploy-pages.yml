name: deploy frontend to GitHub Pages

on:
  push:
    branches: [feat/parksungwoo-stock-options]
  workflow_dispatch:

# gh-pages 브랜치의 정적 결과물을 갱신한다.
permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vue-frontend/package-lock.json

      - name: Install dependencies
        working-directory: vue-frontend
        run: npm ci

      - name: Build frontend
        working-directory: vue-frontend
        run: npm run build

      - name: Publish dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: vue-frontend/dist
