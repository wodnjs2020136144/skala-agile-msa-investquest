<!DOCTYPE html>

  <head>
    <!--
      404.html 에서 되돌아온 요청을 원래 경로로 복원한다.
      다른 스크립트보다 먼저 실행돼야 vue-router 가 올바른 경로를 본다.
      (rafgraph 의 spa-github-pages 기법과 짝을 이룬다 — public/404.html 참고)
    -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&')
          }).join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      }(window.location))
    </script>
