<!DOCTYPE html>
<!--
  GitHub Pages 는 정적 호스팅이라 서버 쪽 rewrite 가 없다.
  vue-router 가 createWebHistory(클린 URL)를 쓰므로 새로고침·직접 진입 시
  GitHub 가 404.html 을 서빙한다. 이 스크립트가 경로를 쿼리스트링에 실어
  index.html 로 되돌리면, index.html 의 스크립트가 원래 경로로 복원한다.
  (rafgraph 의 spa-github-pages 기법 — https://github.com/rafgraph/spa-github-pages)
-->
<html>
  <head>
    <meta charset="utf-8">
    <script>
      var pathSegmentsToKeep = 1; // '/skala-agile-msa-investquest' 를 유지한다
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
